<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JBS — Jing Block Space</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#07111d;
  --panel:#0d1b2b;
  --line:#273d55;
  --text:#eef5ff;
  --muted:#91a6bc;
  --green:#7ce7a2;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

main{
  max-width:920px;
  margin:auto;
  padding:24px 18px 50px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  margin-bottom:26px;
}

.brand h1{
  margin:0;
  font-size:42px;
  letter-spacing:1px;
}

.brand-name{
  margin-top:4px;
  color:var(--muted);
  font-size:15px;
}

.core{
  margin-top:8px;
  color:var(--green);
  font-size:14px;
}

.lang{
  color:var(--text);
  text-decoration:none;
  border:1px solid var(--line);
  padding:8px 13px;
  border-radius:9px;
}

.status{
  color:var(--green);
  margin-bottom:14px;
  font-size:14px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
}

h2{
  margin:0 0 15px;
  font-size:20px;
}

label{
  display:block;
  margin:11px 0 6px;
  color:#b7c8da;
  font-size:14px;
}

input,select,textarea,button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #36516c;
  background:#071421;
  color:white;
  font:inherit;
}

textarea{
  resize:vertical;
}

button{
  cursor:pointer;
  font-weight:700;
}

button:hover{
  border-color:#6b8cab;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px;
}

.node{
  padding:11px;
  border:1px solid #29445f;
  border-radius:10px;
  margin:7px 0;
  cursor:pointer;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#050d16;
  padding:11px;
  border-radius:10px;
  min-height:60px;
  font-size:13px;
}

/* Keep protocol configuration available to app.js,
   but hidden from normal users. */
.internal{
  display:none;
}

.small{
  color:var(--muted);
  font-size:13px;
}

footer{
  text-align:center;
  color:#657b91;
  font-size:12px;
  margin-top:24px;
}

@media(max-width:700px){
  main{padding:18px 12px 40px}
  .brand h1{font-size:34px}
  .row{grid-template-columns:1fr}
}
</style>
</head>

<body>
<main>

<header>
  <div class="brand">
    <h1>JBS</h1>
    <div class="brand-name">Jing Block Space</div>
    <div class="core">JOFP · Field Ω</div>
  </div>

  <a class="lang" href="./zh.html">中文</a>
</header>

<div id="status" class="status">Ready</div>


<!-- Internal configuration.
     IDs are preserved for the existing app.js. -->
<section class="internal">
  <input id="api">
  <input id="key" type="password">
</section>


<section class="card">
  <h2>My Device</h2>

  <label>Device Name</label>
  <input id="name" placeholder="Phone / Laptop / Desktop">

  <label>Device Type</label>
  <select id="type">
    <option>Android Phone</option>
    <option>Windows Desktop</option>
    <option>Windows Notebook</option>
    <option>Mac</option>
    <option>Linux</option>
    <option>Other</option>
  </select>

  <div class="row">
    <button id="register">CONNECT</button>
    <button id="discover">FIND DEVICES</button>
  </div>

  <button id="field" class="internal">FIELD STATUS</button>

  <pre id="me">Not connected.</pre>
</section>


<section class="card">
  <h2>Devices</h2>

  <div id="nodes">
    <div class="small">No devices found.</div>
  </div>

  <!-- Preserved for existing app.js -->
  <div class="internal">
    <input id="target">
  </div>

  <button id="pair">CONNECT DEVICE</button>
</section>


<section class="card">
  <h2>Message</h2>

  <textarea
    id="message"
    rows="4"
    placeholder="Write a message..."></textarea>

  <div class="row">
    <button id="send">SEND</button>
    <button id="receive">RECEIVE</button>
  </div>

  <pre id="messages">No messages.</pre>
</section>


<section class="card">
  <h2>JBS Coin</h2>

  <!-- Existing runtime fields preserved -->
  <div class="internal">
    <input id="coinName" value="JSL Second Coin">
    <input id="coinSymbol" value="JSL2">
    <input id="coinDecimals" type="number" value="4">
    <input id="coinSupply" type="number" value="1000000">
  </div>

  <div class="row">
    <button id="coinInit">OPEN</button>
    <button id="coinInfo">BALANCE</button>
  </div>

  <label>Send To</label>
  <input id="coinTarget" placeholder="Select or enter recipient">

  <label>Amount</label>
  <input id="coinAmount" type="number" value="1" min="0">

  <div class="row">
    <button id="coinSend">TRANSFER</button>
    <button id="coinHistory">HISTORY</button>
  </div>

  <pre id="coinStatus">Wallet not opened.</pre>
</section>


<!-- Keep log in DOM for app.js, but don't expose engineering
     information on the commercial interface. -->
<section class="internal">
  <pre id="log"></pre>
</section>


<footer>
  JBS · Jing Block Space
  <br>
  JOFP · Field Ω
</footer>


<script type="module" src="./app.js"></script>

</main>
</body>
</html>
