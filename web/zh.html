<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JBS — Jing Block Space</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#07111d;
  --panel:#0d1b2b;
  --line:#263c54;
  --text:#eef5ff;
  --muted:#94a8bd;
  --accent:#7ce7a2;
  --button:#0a1725;
}
html{background:var(--bg)}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
main{
  max-width:760px;
  margin:0 auto;
  padding:24px 16px 44px;
}
header{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start;
  margin-bottom:28px;
}
h1{margin:0;font-size:42px;letter-spacing:.5px}
.brand-line{color:var(--muted);margin-top:4px}
.core{color:var(--accent);font-size:14px;margin-top:7px}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nav a{
  color:var(--text);
  text-decoration:none;
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 12px;
  font-size:14px;
}
.status{
  min-height:22px;
  color:var(--muted);
  margin-bottom:12px;
  font-size:14px;
}
.status.ok{color:var(--accent)}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
}
h2{font-size:19px;margin:0 0 14px}
label{display:block;color:#becddd;font-size:14px;margin:11px 0 6px}
input,select,textarea,button{
  width:100%;
  border:1px solid #36516c;
  background:var(--button);
  color:var(--text);
  border-radius:10px;
  padding:12px;
  font:inherit;
}
textarea{resize:vertical}
button{cursor:pointer;font-weight:700}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px;
}
#me,#messages,#coinBox{
  white-space:pre-wrap;
  word-break:break-word;
  background:#06101a;
  border-radius:10px;
  padding:12px;
  min-height:48px;
  color:#cbd8e5;
  margin-top:10px;
}
.device{
  text-align:left;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}
.device.selected{border-color:var(--accent)}
.device-type{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:5px 0 10px}
.coin-link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--text);
  text-decoration:none;
  font-weight:700;
}
footer{
  margin-top:26px;
  padding-top:18px;
  border-top:1px solid var(--line);
  text-align:center;
  color:var(--muted);
  line-height:1.8;
  font-size:13px;
}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--text)}
.internal{display:none!important}
@media(max-width:620px){
  main{padding:18px 12px 36px}
  h1{font-size:34px}
  .row{grid-template-columns:1fr}
  header{align-items:flex-start}
}
</style>
</head>
<body data-page="main">
<main>
<header>
  <div>
    <h1>JBS</h1>
    <div class="brand-line">Jing Block Space</div>
    <div class="core">JOFP · Field Ω</div>
  </div>
  <nav class="nav">
    <a href="./index.html">English</a>
  </nav>
</header>

<div id="status" class="status">准备就绪</div>

<section class="card">
  <h2>我的设备</h2>
  <label for="name">设备名称</label>
  <input id="name" placeholder="手机 / 笔记本 / 电脑">
  <label for="type">设备类型</label>
  <select id="type">
    <option>Android Phone</option>
    <option>Windows Desktop</option>
    <option>Windows Notebook</option>
    <option>Mac</option>
    <option>Linux</option>
    <option>Other</option>
  </select>
  <div class="row">
    <button id="register">连接</button>
    <button id="discover">查找设备</button>
  </div>
  <div id="me">未连接</div>
</section>

<section class="card">
  <h2>设备</h2>
  <div id="nodes"><div class="empty">未发现设备。</div></div>
  <input id="target" class="internal" aria-hidden="true">
  <button id="pair">连接设备</button>
</section>

<section class="card">
  <h2>消息</h2>
  <textarea id="message" rows="4" placeholder="输入消息..."></textarea>
  <div class="row">
    <button id="send">发送</button>
    <button id="receive">接收</button>
  </div>
  <div id="messages">暂无消息。</div>
</section>

<section class="card">
  <a class="coin-link" href="./coin-zh.html">
    <span>JBS Coin</span>
    <span>→</span>
  </a>
</section>

<input id="api" type="hidden">
<input id="key" type="hidden">
<pre id="log" class="internal"></pre>


<footer>
  <div>JSL-IAN</div>
  <div><a href="https://www.jsl-ian.com/" target="_blank" rel="noopener">www.jsl-ian.com</a></div>
  <div><a href="mailto:support@jsl-ian.com">support@jsl-ian.com</a></div>
  <div><a href="tel:18665888182">18665888182</a></div>
</footer>

<script type="module" src="./app.js"></script>
</main>
</body>
</html>
